<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .mode-buttons {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 18px;
      background: #3b82f6;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #2563eb;
    }

    .hidden {
      display: none;
    }

    .pfp-container {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .pfp {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      transition: 0.2s;
      object-fit: cover;
    }

    .pfp:hover {
      transform: scale(1.1);
    }

    .selected {
      border-color: #3b82f6;
      transform: scale(1.15);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 250px;
    }

    input {
      padding: 10px;
      border-radius: 6px;
      border: none;
      outline: none;
    }
  </style>
</head>
<body>

  <h1>Welcome</h1>

  <div class="mode-buttons">
    <button id="signupBtn">Sign Up</button>
    <button id="loginBtn">Login</button>
  </div>

  <!-- SIGN UP SECTION -->
  <div id="signupSection" class="hidden">
    <h2>Create Account</h2>

    <div class="pfp-container" id="pfpContainer"></div>

    <form id="signupForm">
      <input type="text" id="su_username" placeholder="Username" required>
      <input type="password" id="su_password" placeholder="Password" required>
      <input type="hidden" id="selectedPfp">
      <button type="submit">Create Account</button>
    </form>
  </div>

  <!-- LOGIN SECTION -->
  <div id="loginSection" class="hidden">
    <h2>Login</h2>

    <form id="loginForm">
      <input type="text" id="li_username" placeholder="Username" required>
      <input type="password" id="li_password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
  </div>

  <script>
    const signupBtn = document.getElementById("signupBtn");
    const loginBtn = document.getElementById("loginBtn");

    const signupSection = document.getElementById("signupSection");
    const loginSection = document.getElementById("loginSection");

    // Switch modes
    signupBtn.onclick = () => {
      signupSection.classList.remove("hidden");
      loginSection.classList.add("hidden");
    };

    loginBtn.onclick = () => {
      loginSection.classList.remove("hidden");
      signupSection.classList.add("hidden");
    };

    // Load PFP images
    const pfpContainer = document.getElementById("pfpContainer");

    for (let i = 1; i <= 3; i++) {
      const img = document.createElement("img");
      img.src = `img${i}.jpeg`;
      img.classList.add("pfp");

      img.addEventListener("click", () => {
        document.querySelectorAll(".pfp").forEach(p => p.classList.remove("selected"));
        img.classList.add("selected");
        document.getElementById("selectedPfp").value = img.src;
      });

      pfpContainer.appendChild(img);
    }

    // SIGN UP
    document.getElementById("signupForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const username = document.getElementById("su_username").value;
      const password = document.getElementById("su_password").value;
      const pfp = document.getElementById("selectedPfp").value;

      if (!pfp) {
        alert("Please select a profile picture");
        return;
      }

      const account = { username, password, pfp };
      localStorage.setItem("account", JSON.stringify(account));

      alert("Account created!");
      window.location.href = "home.html";
    });

    // LOGIN
    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const username = document.getElementById("li_username").value;
      const password = document.getElementById("li_password").value;

      const saved = JSON.parse(localStorage.getItem("account"));

      if (!saved) {
        alert("No account found. Please sign up first.");
        return;
      }

      if (username === saved.username && password === saved.password) {
        alert("Login successful!");
        window.location.href = "home.html";
      } else {
        alert("Incorrect username or password");
      }
    });
  </script>

</body>
</html>
