<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #0f0f0f;
      font-family: Arial, sans-serif;
      color: white;
    }

    /* Hamburger Menu */
    #menuBtn {
      position: absolute;
      top: 15px;
      left: 15px;
      width: 40px;
      height: 40px;
      background: #1a1a1a;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 20;
    }

    #menuBtn div {
      width: 24px;
      height: 3px;
      background: white;
      margin: 3px 0;
      border-radius: 2px;
    }

    /* Game Area */
    #gameArea {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #111;
    }

    /* Player rectangles */
    .player {
      position: absolute;
      width: 50px;
      height: 70px;
      background: #3b82f6;
      border-radius: 6px;
      transform: translate(-50%, -50%);
    }

    /* Joystick */
    #joystickBase {
      position: absolute;
      bottom: 30px;
      left: 30px;
      width: 140px;
      height: 140px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      backdrop-filter: blur(4px);
      touch-action: none;
      z-index: 10;
    }

    #joystickStick {
      position: absolute;
      width: 70px;
      height: 70px;
      background: rgba(255,255,255,0.3);
      border-radius: 50%;
      top: 35px;
      left: 35px;
      transition: 0.05s;
      touch-action: none;
    }

    /* Chat */
    #chatBox {
      position: absolute;
      right: 10px;
      bottom: 10px;
      width: 220px;
      height: 200px;
      background: rgba(0,0,0,0.6);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 15;
    }

    #messages {
      flex: 1;
      padding: 8px;
      overflow-y: auto;
      font-size: 12px;
    }

    #chatForm {
      display: flex;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    #chatInput {
      flex: 1;
      border: none;
      outline: none;
      padding: 6px;
      font-size: 12px;
      background: transparent;
      color: white;
    }

    #chatSend {
      border: none;
      background: #3b82f6;
      color: white;
      padding: 0 10px;
      cursor: pointer;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <!-- Hamburger Menu -->
  <div id="menuBtn">
    <div></div>
    <div></div>
    <div></div>
  </div>

  <!-- Game Area -->
  <div id="gameArea">
    <!-- Joystick -->
    <div id="joystickBase">
      <div id="joystickStick"></div>
    </div>

    <!-- Chat -->
    <div id="chatBox">
      <div id="messages"></div>
      <form id="chatForm">
        <input id="chatInput" type="text" placeholder="Say something..." autocomplete="off">
        <button id="chatSend" type="submit">Send</button>
      </form>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <script>
    // 🔐 REPLACE THIS WITH YOUR REAL CONFIG (from Firebase console)
    const firebaseConfig = {
      apiKey: "YOUR_KEY",
      authDomain: "YOUR_APP.firebaseapp.com",
      databaseURL: "https://YOUR_APP-default-rtdb.firebaseio.com",
      projectId: "YOUR_APP",
      storageBucket: "YOUR_APP.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // MENU → HOME
    document.getElementById("menuBtn").onclick = () => {
      window.location.href = "home.html";
    };

    // Load current game (room)
    const game = JSON.parse(localStorage.getItem("currentGame"));
    if (!game) {
      alert("No game selected.");
      window.location.href = "home.html";
    }
    const roomId = game.name.replace(/\s+/g, "_"); // simple room id

    // Create local player
    const gameArea = document.getElementById("gameArea");
    const myId = "p_" + Math.random().toString(36).slice(2);
    const playersRef = db.ref("rooms/" + roomId + "/players");
    const myRef = playersRef.child(myId);

    let px = window.innerWidth / 2;
    let py = window.innerHeight / 2;

    myRef.set({ x: px, y: py });
    myRef.onDisconnect().remove();

    // Track all players
    const players = {};

    function createOrUpdatePlayer(id, data) {
      let el = players[id];
      if (!el) {
        el = document.createElement("div");
        el.classList.add("player");
        gameArea.appendChild(el);
        players[id] = el;
      }
      el.style.left = data.x + "px";
      el.style.top = data.y + "px";
      // Different color for others
      if (id !== myId) el.style.background = "#10b981";
    }

    function removePlayer(id) {
      const el = players[id];
      if (el) {
        el.remove();
        delete players[id];
      }
    }

    // Listen for players
    playersRef.on("child_added", snap => {
      createOrUpdatePlayer(snap.key, snap.val());
    });

    playersRef.on("child_changed", snap => {
      createOrUpdatePlayer(snap.key, snap.val());
    });

    playersRef.on("child_removed", snap => {
      removePlayer(snap.key);
    });

    // Joystick movement
    const stick = document.getElementById("joystickStick");
    const base = document.getElementById("joystickBase");
    let dragging = false;

    base.addEventListener("touchstart", () => dragging = true);

    base.addEventListener("touchend", () => {
      dragging = false;
      stick.style.left = "35px";
      stick.style.top = "35px";
      // stop movement
    });

    base.addEventListener("touchmove", (e) => {
      if (!dragging) return;

      const rect = base.getBoundingClientRect();
      const touch = e.touches[0];

      let x = touch.clientX - rect.left - 35;
      let y = touch.clientY - rect.top - 35;

      const dist = Math.sqrt(x*x + y*y);
      const maxDist = 50;

      if (dist > maxDist) {
        x = (x / dist) * maxDist;
        y = (y / dist) * maxDist;
      }

      stick.style.left = (35 + x) + "px";
      stick.style.top = (35 + y) + "px";

      px += x * 0.15;
      py += y * 0.15;

      myRef.set({ x: px, y: py });
    });

    // Chat
    const messagesRef = db.ref("rooms/" + roomId + "/messages");
    const messagesDiv = document.getElementById("messages");
    const chatForm = document.getElementById("chatForm");
    const chatInput = document.getElementById("chatInput");

    messagesRef.limitToLast(50).on("child_added", snap => {
      const msg = snap.val();
      const div = document.createElement("div");
      div.textContent = msg.text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });

    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (!text) return;
      messagesRef.push({ text });
      chatInput.value = "";
    });
  </script>

</body>
</html>
